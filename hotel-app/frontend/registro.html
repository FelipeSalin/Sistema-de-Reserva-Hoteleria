<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Hotel App</title>
    <link rel="stylesheet" href="css/styles.css"/>
</head>

<div class="login-card">
        <h2>¿Nuevo usuario?</h2>
        <h3>Rellena el formulario para crear tu cuenta</h3>

        <div class="avatar">👤</div>

        <label>Nombre completo:</label>
        <input type="text" id="nombre">

        <label>Correo electrónico:</label>
        <input type="text" id="correo">

        <label>Número de teléfono:</label>
        <input type="text" id="telefono">

        <label>Género:</label>
        <select id="genero">
            <option value="">Seleccionar...</option>
            <option value="femenino">Femenino</option>
            <option value="masculino">Masculino</option>
            <option value="otro">Otro</option>
        </select>

        <br>
        <br>

        <label>Contraseña:</label>
        <input type="password" id="password">

        <label>Repetir contraseña:</label>
        <input type="password" id="password2">

        <button class="btn-ingresar" onclick="registrar()">Registrarse</button>

        <a href="login.html" class="links">¿Ya tienes una cuenta? Ingresa acá</a>
    </div>

<script>
function registrar() {
    fetch("http://localhost:3000/cliente", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            cliente_id: id.value,
            nombre: nombre.value,
            correo_electronico: correo.value,
            telefono: telefono.value,
            genero: genero.value,
            contraseña: contraseña.value
        })
    })
    .then(res => res.text())
    .then(data => alert(data));
}
</script>
