<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Hotelero</title>
    <!-- Conectamos el archivo CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <div class="login-card">
        <h2>Ingresa a tu cuenta</h2>

        <!-- Icono circular de usuario -->
        <div class="avatar">👤</div>

        <form id="loginForm">
            <label for="correo">Nombre de usuario:</label>
            <input type="text" id="correo" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>

            <a href="#" class="links">Olvidé usuario/contraseña</a>

            <button type="button" class="btn-ingresar" onclick="login()">Ingresar</button>
        </form>

        <a href="registro.html" class="links">¿No tienes una cuenta? Regístrate</a>

        <p style="margin: 15px 0; color: #666;">o</p>

        <button class="social-btn facebook">
            <span>Ingresa con Facebook</span>
        </button>

        <button class="social-btn google">
            <span>Ingresa con Google</span>
        </button>
    </div>

    <script>
        async function login() {
            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ correo, password })
                });

                const data = await res.text();

                if (data === "Login correcto") {
                    window.location.href = "reserva.html";
                } else {
                    alert("Credenciales no válidas");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                alert("No se pudo conectar con el servidor.");
            }
        }
    </script>

</body>


</html>
